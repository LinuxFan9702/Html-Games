<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin-top: 50px;
        }
        .click-btn {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
        }
        .click-btn:active {
            background-color: #45a049;
        }
        h1 {
            font-size: 48px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Score: <span id="score">0</span></h1>
    <button class="click-btn" onclick="incrementScore()">Click Me!</button>

    <script>
        let count = 0;
        const scoreDisplay = document.getElementById('score');

        function incrementScore() {
            count++;
            scoreDisplay.textContent = count;
        }
    </script>

</body>
</html>
